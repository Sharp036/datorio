# ══════════════════════════════════════════════════
#  Apache Airflow 3 for the "Start a job" example
# ══════════════════════════════════════════════════
# Start it together with the main stack:
#   docker compose -f docker-compose.yml -f examples/airflow/compose.yml up -d
# Airflow UI: http://localhost:8088 (user datorio, password datorio).
# A single-container Airflow with SQLite, for trying the integration only.

services:
  airflow:
    image: apache/airflow:3.2.0
    container_name: datorio-airflow
    command:
      - bash
      - -c
      - |
        echo '{"datorio": "datorio"}' > /opt/airflow/passwords.json
        exec airflow standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: datorio:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/passwords.json
      AIRFLOW__API_AUTH__JWT_SECRET: datorio-example-only-not-for-production
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD:-clickhouse}
      DATORIO_DEMO_STEP_SECONDS: ${DATORIO_DEMO_STEP_SECONDS:-8}
    ports:
      - "${AIRFLOW_PORT:-8088}:8080"
    volumes:
      - ./examples/airflow/dags:/opt/airflow/dags
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v2/version"]
      interval: 15s
      timeout: 5s
      retries: 20
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - datorio-net

  datorio:
    environment:
      AIRFLOW_API_URL: http://airflow:8080
      AIRFLOW_API_USER: datorio
      AIRFLOW_API_PASSWORD: datorio
      AIRFLOW_ALLOWED_DAGS: datorio_demo_sales_summary
