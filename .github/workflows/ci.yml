name: Datorio BI — CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Test ──
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: datorio_test
          POSTGRES_USER: datorio
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/datorio_test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: datorio_test
          DB_USER: datorio
          DB_PASSWORD: test
          JWT_SECRET: test_secret_at_least_32_characters_long_for_jwt
        run: ./gradlew :backend:test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/build/reports/tests/

  # ── Examples: the quick start stack, the Airflow example DAG and the example reports ──
  examples:
    runs-on: ubuntu-latest
    env:
      DATORIO_DEMO_STEP_SECONDS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Start the quick start stack (Datorio built from this commit) with the Airflow example
        run: docker compose -f docker-compose.yml -f examples/airflow/compose.yml up -d --build --wait --wait-timeout 900

      - name: Check the sample data, run the example DAG and every query of the example reports
        run: python3 .github/scripts/check_examples.py

      - name: Load the examples into Datorio the way the README says
        run: python3 examples/load_examples.py

      - name: Render the example reports in Datorio and start the DAG with the report button
        run: python3 .github/scripts/check_examples.py datorio

      - name: Container logs
        if: failure()
        run: docker compose -f docker-compose.yml -f examples/airflow/compose.yml logs --tail 300

  # ── Build & Push Docker Image ──
  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repo name
        id: lower
        run: echo "repo=$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.lower.outputs.repo }}:latest
            ghcr.io/${{ steps.lower.outputs.repo }}:${{ github.sha }}
