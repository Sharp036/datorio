name: Datorio BI — CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Test ──
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: datorio_test
          POSTGRES_USER: datorio
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/datorio_test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: datorio_test
          DB_USER: datorio
          DB_PASSWORD: test
          JWT_SECRET: test_secret_at_least_32_characters_long_for_jwt
        run: ./gradlew :backend:test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/build/reports/tests/

  # ── Sample data of the quick start ──
  sample-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load docker/clickhouse/init.sql into the ClickHouse image of docker-compose.yml
        run: |
          image=$(grep -oE 'clickhouse/clickhouse-server:[^" ]+' docker-compose.yml)
          docker run -d --name clickhouse "$image"
          timeout 120 sh -c 'until docker exec clickhouse clickhouse-client -q "SELECT 1" >/dev/null 2>&1; do sleep 2; done'
          docker exec -i clickhouse clickhouse-client --multiquery < docker/clickhouse/init.sql
          docker exec -i clickhouse clickhouse-client --multiquery <<'SQL'
          SELECT throwIf(count() < 30000 OR uniqExact(order_id) != count()
                         OR min(sale_date) != '2024-01-01' OR max(sale_date) != '2025-12-31', 'unexpected sample.sales')
          FROM sample.sales FORMAT Null;
          SELECT throwIf(count() < 200000 OR min(event_date) != '2024-01-01' OR max(event_date) != '2025-12-31',
                         'unexpected sample.page_views')
          FROM sample.page_views FORMAT Null;
          SELECT count() AS sales_rows, max(order_id) AS last_order_id, round(sum(total_amount)) AS revenue
          FROM sample.sales FORMAT PrettyCompactMonoBlock;
          SELECT count() AS page_view_rows, uniqExact(session_id) AS sessions, uniqExact(user_id) AS users
          FROM sample.page_views FORMAT PrettyCompactMonoBlock;
          SQL

  # ── Build & Push Docker Image ──
  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repo name
        id: lower
        run: echo "repo=$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.lower.outputs.repo }}:latest
            ghcr.io/${{ steps.lower.outputs.repo }}:${{ github.sha }}
