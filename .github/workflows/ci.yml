name: Datorio BI — CI

on:
  push:
    branches: [main, develop]
    # A release tag (v1.2.0) publishes the image as 1.2.0 and 1.2
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Test ──
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: datorio_test
          POSTGRES_USER: datorio
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Check that every UI locale has the keys and placeholders of en.json
        run: python3 .github/scripts/check_locales.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/datorio_test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: datorio_test
          DB_USER: datorio
          DB_PASSWORD: test
          JWT_SECRET: test_secret_at_least_32_characters_long_for_jwt
        run: ./gradlew :backend:test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/build/reports/tests/

  # Frontend: ESLint (the type check and the build run in the image build)
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

  # ── Examples: the quick start stack, the Airflow example DAG and the example reports ──
  examples:
    runs-on: ubuntu-latest
    env:
      DATORIO_DEMO_STEP_SECONDS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Start the quick start stack (Datorio built from this commit) with the Airflow example
        run: docker compose -f docker-compose.yml -f examples/airflow/compose.yml up -d --build --wait --wait-timeout 900

      - name: Check the sample data, run the example DAG and every query of the example reports
        run: python3 .github/scripts/check_examples.py

      - name: Load the examples into Datorio the way the README says
        run: python3 examples/load_examples.py

      - name: Render the example reports in Datorio and start the DAG with the report button
        run: python3 .github/scripts/check_examples.py datorio

      - name: Check how the page and the built files are served
        run: |
          page=$(curl -fsS -D page_headers.txt http://localhost:8080/reports)
          grep -qi '^cache-control: no-cache' page_headers.txt
          js=$(echo "$page" | grep -o '/assets/index-[^"]*\.js' | head -1)
          test -n "$js"
          curl -fsS -o /dev/null -D js_headers.txt "http://localhost:8080$js"
          grep -qi '^cache-control:.*immutable' js_headers.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/missing-file.js)" = 404

      - name: Container logs
        if: failure()
        run: docker compose -f docker-compose.yml -f examples/airflow/compose.yml logs --tail 300

  # ── Build & Push Docker Image ──
  build:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repo name
        id: lower
        run: echo "repo=$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')" >> $GITHUB_OUTPUT

      # main: latest and the commit; a release tag v1.2.0: 1.2.0 and 1.2
      - name: Image tags
        id: tags
        run: |
          image="ghcr.io/${{ steps.lower.outputs.repo }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            printf 'list<<EOF\n%s:%s\n%s:%s\nEOF\n' "$image" "$version" "$image" "${version%.*}" >> "$GITHUB_OUTPUT"
          else
            printf 'list<<EOF\n%s:latest\n%s:%s\nEOF\n' "$image" "$image" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
