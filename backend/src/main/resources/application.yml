spring:
  application:
    name: datorio

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

  # ── Metadata Database (internal) ──
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:datorio}?stringtype=unspecified
    username: ${DB_USER:datorio}
    password: ${DB_PASSWORD:datorio}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway manages schema
    open-in-view: false
    properties:
      hibernate:
        # No dialect on purpose: keeps the app independent of the PostgreSQL
        # major version. Do not re-add a dialect here.
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  task:
    scheduling:
      pool:
        size: 4   # report schedules, data alerts and the live update heartbeat must not wait for one another

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# ── Server ──
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

# ── Security / JWT ──
datorio:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_min_32_chars_long_secret_key_here}
    access-token-expiration: 3600000    # 1 hour
    refresh-token-expiration: 604800000  # 7 days

  security:
    # Key for the data source passwords stored in the metadata database; JWT_SECRET is used when empty
    datasource-encryption-key: ${DATASOURCE_ENCRYPTION_KEY:}

  auth:
    # true lets anyone create a VIEWER account through POST /api/auth/register
    registration-enabled: ${REGISTRATION_ENABLED:false}

  query:
    # A widget or console query running longer than this is cancelled
    timeout-seconds: ${QUERY_TIMEOUT_SECONDS:120}

  # ── Default Admin (created on first startup) ──
  admin:
    username: ${ADMIN_USER:admin}
    password: ${ADMIN_PASSWORD:admin}
    email: ${ADMIN_EMAIL:admin@datorio.local}

  # ── Scripting Engine Limits (sandbox for untrusted user JS) ──
  scripting:
    timeout-ms: 5000           # wall-clock kill via Context.close(true)
    max-statements: 100000     # ResourceLimits statement guard (Community GraalVM)
    max-memory-mb: 64          # per-context heap cap; enforced ONLY on Oracle GraalVM + truffle-enterprise
    max-output-bytes: 5242880  # 5 MB cap on the JSON result returned by a script
    max-script-length: 100000  # max characters of user code + libraries combined
    max-concurrent: 4          # max scripts running at once; excess requests rejected, not queued
  
  # ── Airflow (RUN_JOB buttons start DAG runs through the REST API) ──
  airflow:
    base-url: ${AIRFLOW_API_URL:}              # e.g. http://host:5080, empty = buttons disabled
    username: ${AIRFLOW_API_USER:}
    password: ${AIRFLOW_API_PASSWORD:}
    allowed-dags: ${AIRFLOW_ALLOWED_DAGS:}     # comma-separated DAG ids the buttons may start
    timeout-seconds: 30

  # ── Saved exports (lost with the container unless a volume is mounted there) ──
  export:
    directory: ${EXPORT_DIRECTORY:/tmp/datorio-exports}

  # ── Email delivery of reports (SMTP), off until EMAIL_ENABLED=true ──
  email:
    enabled: ${EMAIL_ENABLED:false}
    smtp-host: ${SMTP_HOST:}
    smtp-port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${EMAIL_FROM:noreply@datorio.local}
    use-tls: ${SMTP_USE_TLS:true}

  # ── Embedded reports: empty base URL = links relative to the current site ──
  embed:
    base-url: ${EMBED_BASE_URL:}

  cache:
      enabled: true
      query-ttl-seconds: 300
      query-max-size: 500
      schema-ttl-seconds: 600

# ── Actuator (health checks) ──
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# ── OpenAPI / Swagger ──
springdoc:
  api-docs:
    path: /docs/openapi
  swagger-ui:
    path: /docs/swagger

# ── Logging ──
logging:
  level:
    com.datorio: ${LOG_LEVEL:INFO}
    org.springframework.security: INFO
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
    org.springframework.web.filter.CommonsRequestLoggingFilter: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{requestId:-}] %-5level %logger{36} - %msg%n"

---
# ── Profile: Docker ──
# The metadata database comes from DB_HOST, DB_PORT and DB_NAME as in the base profile
spring:
  config:
    activate:
      on-profile: docker
